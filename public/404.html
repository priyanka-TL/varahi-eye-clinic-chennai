<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting… | Sree Varahi Eye Clinic</title>
  <script type="text/javascript">
    // GitHub Pages has no server-side routing, so a direct visit or refresh
    // on any app route (e.g. /varahi-eye-clinic-chennai/about) hits this
    // 404 page. It re-encodes the path into a query string and redirects
    // to index.html, which decodes it back before React Router mounts.
    // Technique: https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 1; // keeps '/varahi-eye-clinic-chennai'
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
